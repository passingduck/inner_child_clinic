<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내면아이 클리닉 - 정보 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>내면아이 치유</h1>

    {% if error %}
        <p style="color: red; text-align: center;">{{ error }}</p>
    {% endif %}

    <form id="inputForm">
        <div>
            <label for="photo">사진 업로드:</label>
            <input type="file" id="photo" name="photo" accept="image/*" required>
        </div>
        <div>
            <label for="trauma">트라우마 상황을 설명해주세요:</label>
            <textarea id="trauma" name="trauma" rows="4" required></textarea>
        </div>
        <button type="submit">치유 시작하기</button>
    </form>
    <script>
        document.getElementById('inputForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const formData = new FormData(this);

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else {
                        window.location.href = '/start_interaction';
                    }
                } else {
                    const responseText = await response.text();
                    if (response.headers.get("content-type")?.includes("text/html")) {
                        document.open();
                        document.write(responseText);
                        document.close();
                    } else {
                         console.error('Form submission failed:', response.statusText);
                    }
                }
            } catch (error) {
                console.error('Error submitting form:', error);
            }
        });
    </script>
</body>
</html>
