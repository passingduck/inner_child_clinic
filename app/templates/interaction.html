<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내면아이 클리닉 - 대화하기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>내면아이와 대화하기</h1>
    <div id="childImageContainer">
        <img src="{{ image_url }}" alt="생성된 내면아이 이미지" style="max-width: 300px; max-height: 300px; display: block; margin: auto;">
    </div>
    <div id="dialogueBox">
        <!-- Dialogue will be displayed here by JavaScript -->
    </div>
    <div id="gaugeContainer">
        <label for="recoveryGauge">회복 게이지:</label>
        <progress id="recoveryGauge" value="0" max="10"></progress>
        <span id="gaugeValue">0/10</span>
    </div>
    <div id="userInput">
        <textarea id="userMessage" placeholder="아이에게 말을 걸어보세요..."></textarea>
        <button id="sendMessage">전송</button>
    </div>
    <script>
        const dialogueBox = document.getElementById('dialogueBox');
        const userMessageInput = document.getElementById('userMessage');
        const gaugeElement = document.getElementById('recoveryGauge');
        const gaugeValueElement = document.getElementById('gaugeValue');
        let currentGaugeValue = 0;

        gaugeElement.value = currentGaugeValue;
        gaugeValueElement.textContent = currentGaugeValue + '/10';

        dialogueBox.innerHTML = '';

        const initialGreeting = "{{ initial_greeting|e }}";

        if (initialGreeting && initialGreeting !== "None" && initialGreeting.trim() !== "") {
            appendMessage('아이', initialGreeting); // Child's greeting
        }

        document.getElementById('sendMessage').addEventListener('click', async function() {
            const messageText = userMessageInput.value.trim();
            if (messageText === '') return;

            appendMessage('사용자', messageText); // User's message
            userMessageInput.value = '';

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                if (response.ok) {
                    const data = await response.json();
                    appendMessage('아이', data.response_text); // Child's response

                    const score = parseInt(data.score, 10);
                    if (!isNaN(score)) {
                        currentGaugeValue += score;
                        currentGaugeValue = Math.max(0, Math.min(10, currentGaugeValue));

                        gaugeElement.value = currentGaugeValue;
                        gaugeValueElement.textContent = currentGaugeValue + '/10';

                        if (currentGaugeValue >= 10) {
                            appendMessage('시스템', "아이의 마음이 치유되었습니다! 치유 완료."); // System message
                            userMessageInput.disabled = true;
                            document.getElementById('sendMessage').disabled = true;
                        }
                    } else {
                        console.warn("Received an invalid score:", data.score);
                    }

                } else {
                    const errorData = await response.json();
                    appendMessage('시스템', `오류: 응답을 받을 수 없습니다. ${errorData.error || response.statusText}`); // System error
                }
            } catch (error) {
                appendMessage('시스템', '오류: 서버 연결에 문제가 발생했습니다.'); // System network error
            }
        });

        function appendMessage(sender, text) {
            const messageElement = document.createElement('p');
            const strongElement = document.createElement('strong');
            strongElement.textContent = sender + ': ';
            messageElement.appendChild(strongElement);
            messageElement.appendChild(document.createTextNode(text));

            dialogueBox.appendChild(messageElement);
            dialogueBox.scrollTop = dialogueBox.scrollHeight;
        }
    </script>
</body>
</html>
